<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriTrace - Demo Khai Báo Lô Đất</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      h2 {
        color: #2e7d32;
        text-align: center;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #2e7d32;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #1b5e20;
      }
      #response {
        margin-top: 20px;
        padding: 10px;
        background: #f4f4f4;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h2>AgriTrace API Demo</h2>
    <form id="landPlotForm">
      <div class="form-group">
        <label>Tên lô đất:</label>
        <input type="text" id="name" value="Lô đất Chè A1" required />
      </div>
      <div class="form-group">
        <label>Diện tích ($m^2$):</label>
        <input type="number" id="area" value="1200.5" step="0.1" required />
      </div>
      <div class="form-group">
        <label>Tọa độ GPS:</label>
        <input type="text" id="coordinates" value="21.592, 105.844" />
      </div>
      <div class="form-group">
        <label>ID Tổ chức:</label>
        <input type="number" id="organization_id" value="1" />
      </div>
      <button type="submit">Gửi khai báo (POST /api/land-plots)</button>
    </form>

    <h3>Kết quả trả về từ Server:</h3>
    <div id="response">Chờ gửi dữ liệu...</div>

    <script>
      document
        .getElementById("landPlotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const responseDiv = document.getElementById("response");
          responseDiv.innerText = "Đang kết nối Server...";

          const payload = {
            name: document.getElementById("name").value,
            area: parseFloat(document.getElementById("area").value),
            coordinates: document.getElementById("coordinates").value,
            organization_id: parseInt(
              document.getElementById("organization_id").value,
            ),
          };

          try {
            const res = await fetch("/api/land-plots", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            responseDiv.innerText =
              `Status Code: ${res.status}\n\n` + JSON.stringify(data, null, 2);
          } catch (err) {
            responseDiv.innerText = "Lỗi kết nối: " + err.message;
          }
        });
    </script>
  </body>
</html>
